<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pothole Map Monitor</title>
  <style>
    :root {
      --bg: #f6f4ee;
      --panel: #ffffff;
      --ink: #1d1d1b;
      --muted: #5a5a53;
      --accent: #a63a2b;
      --border: #ddd7ca;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 10% 10%, #fff9ea, var(--bg));
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, #fff, #fff5de);
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0.4px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto auto auto;
      gap: 10px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    input, button {
      padding: 10px 12px;
      border: 1px solid #cfc8b8;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    input:focus {
      outline: 2px solid #ffd479;
      border-color: #d9b560;
    }

    button {
      cursor: pointer;
      background: #f6ead0;
      color: #2a251b;
      font-weight: 600;
    }

    button:hover { background: #f2dfb2; }

    #status {
      padding: 8px 20px;
      font-size: 0.9rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    #map {
      flex: 1;
      min-height: 420px;
      width: 100%;
    }

    .history-panel {
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 14px 20px 20px;
    }

    .history-controls {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .history-controls select,
    .history-controls input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cfc8b8;
      border-radius: 8px;
    }

    .history-table-wrap {
      max-height: 260px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fffdf8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid #ece6d8;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: #f5efdf;
      z-index: 1;
    }

    .sev-high { color: #b10000; font-weight: 700; }
    .sev-medium { color: #8a6a00; font-weight: 700; }

    @media (max-width: 700px) {
      .controls { grid-template-columns: 1fr; }
      .history-controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Intelligent Pothole Detection and Visualization</h1>
  </header>

  <section class="controls">
    <input id="sourceInput" type="text" placeholder="Optional image path for inference (e.g. datasets/valid/images/road.jpg)" />
    <button id="refreshBtn">Refresh Now</button>
    <button id="resetBtn">Reset Tracks</button>
    <button id="autoBtn">Pause Auto Refresh</button>
  </section>

  <div id="status">Waiting for first API fetch...</div>
  <div id="map"></div>

  <section class="history-panel">
    <div class="history-controls">
      <select id="filterSeverity">
        <option value="">All Severity</option>
        <option value="HIGH">HIGH</option>
        <option value="MEDIUM">MEDIUM</option>
      </select>
      <input id="filterSource" type="text" placeholder="Source contains..." />
      <input id="filterFrom" type="datetime-local" />
      <input id="filterTo" type="datetime-local" />
      <input id="filterLimit" type="number" min="1" max="1000" value="200" />
    </div>
    <div class="history-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Track ID</th>
            <th>Severity</th>
            <th>Lat</th>
            <th>Lng</th>
            <th>Source</th>
            <th>First Seen</th>
            <th>Last Seen</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </section>

  <script>
    let map;
    let markers = [];
    let autoRefresh = true;
    let pollTimer = null;
    let historyTimer = null;
    let latestHistory = [];
    let potholeRequestInFlight = false;
    let historyRequestInFlight = false;
    const DETECTION_INTERVAL_MS = 1000;
    const HISTORY_INTERVAL_MS = 1000;

    function markerIconColor(severity) {
      if (severity === "HIGH") return "red";
      return "yellow";
    }

    function clearMarkers() {
      markers.forEach(marker => marker.setMap(null));
      markers = [];
    }

    function renderMarkers(data) {
      clearMarkers();

      if (!Array.isArray(data) || data.length === 0) {
        document.getElementById("status").textContent = "No potholes detected for current source.";
        return;
      }

      const bounds = new google.maps.LatLngBounds();

      data.forEach(item => {
        const pos = { lat: item.lat, lng: item.lng };
        const marker = new google.maps.Marker({
          position: pos,
          map,
          title: item.severity,
          icon: `http://maps.google.com/mapfiles/ms/icons/${markerIconColor(item.severity)}-dot.png`
        });

        const timestamp = new Date().toLocaleString();
        const info = new google.maps.InfoWindow({
          content: `
            <div style="font-family:Arial,sans-serif;min-width:220px;">
              <p><strong>Severity:</strong> ${item.severity}</p>
              <p><strong>Timestamp:</strong> ${timestamp}</p>
              <p><strong>Status:</strong> Repair Needed</p>
            </div>
          `
        });

        marker.addListener("click", () => info.open(map, marker));
        markers.push(marker);
        bounds.extend(pos);
      });

      map.fitBounds(bounds);
      document.getElementById("status").textContent = `Loaded ${data.length} pothole marker(s).`;
    }

    async function fetchPotholes(reset = false) {
      if (potholeRequestInFlight) return;
      potholeRequestInFlight = true;
      const source = document.getElementById("sourceInput").value.trim();
      const parts = [];
      if (source) parts.push(`source=${encodeURIComponent(source)}`);
      if (reset) parts.push("reset=1");
      const url = parts.length ? `/api/potholes?${parts.join("&")}` : "/api/potholes";

      try {
        const response = await fetch(`${url}${url.includes("?") ? "&" : "?"}_=${Date.now()}`, { cache: "no-store" });
        const payload = await response.json();

        if (!response.ok) {
          document.getElementById("status").textContent = payload.error || "API request failed.";
          return;
        }

        renderMarkers(payload);
        await fetchHistory();
      } catch (err) {
        document.getElementById("status").textContent = `Network/API error: ${err.message}`;
      } finally {
        potholeRequestInFlight = false;
      }
    }

    function toMillis(ts) {
      const ms = Date.parse(ts);
      return Number.isNaN(ms) ? 0 : ms;
    }

    function formatTS(ts) {
      const ms = toMillis(ts);
      if (!ms) return ts || "-";
      return new Date(ms).toLocaleString();
    }

    function passesFilters(row) {
      const severity = document.getElementById("filterSeverity").value;
      const sourcePart = document.getElementById("filterSource").value.trim().toLowerCase();
      const fromVal = document.getElementById("filterFrom").value;
      const toVal = document.getElementById("filterTo").value;

      if (severity && row.severity !== severity) return false;
      if (sourcePart && !String(row.source || "").toLowerCase().includes(sourcePart)) return false;

      const lastSeenMs = toMillis(row.last_seen);
      if (fromVal) {
        const fromMs = toMillis(fromVal);
        if (lastSeenMs < fromMs) return false;
      }
      if (toVal) {
        const toMs = toMillis(toVal);
        if (lastSeenMs > toMs) return false;
      }
      return true;
    }

    function renderHistoryTable(rows) {
      const body = document.getElementById("historyBody");
      body.innerHTML = "";

      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="7">No history rows for current filters.</td></tr>`;
        return;
      }

      rows.forEach(row => {
        const tr = document.createElement("tr");
        const sevClass = row.severity === "HIGH" ? "sev-high" : "sev-medium";
        tr.innerHTML = `
          <td>${row.track_id}</td>
          <td class="${sevClass}">${row.severity}</td>
          <td>${row.lat}</td>
          <td>${row.lng}</td>
          <td title="${row.source || ""}">${row.source || "-"}</td>
          <td>${formatTS(row.first_seen)}</td>
          <td>${formatTS(row.last_seen)}</td>
        `;
        body.appendChild(tr);
      });
    }

    function applyHistoryFilters() {
      const filtered = latestHistory.filter(passesFilters);
      renderHistoryTable(filtered);
    }

    async function fetchHistory() {
      if (historyRequestInFlight) return;
      historyRequestInFlight = true;
      const limit = Math.max(1, Math.min(1000, Number(document.getElementById("filterLimit").value || 200)));
      try {
        const response = await fetch(`/api/potholes/history?limit=${limit}&_=${Date.now()}`, { cache: "no-store" });
        const payload = await response.json();
        if (!response.ok || !Array.isArray(payload)) return;
        latestHistory = payload;
        applyHistoryFilters();
      } catch (_) {
        // Keep map flow stable even if history endpoint is temporarily unavailable.
      } finally {
        historyRequestInFlight = false;
      }
    }

    function toggleAutoRefresh() {
      autoRefresh = !autoRefresh;
      const btn = document.getElementById("autoBtn");

      if (autoRefresh) {
        btn.textContent = "Pause Auto Refresh";
        startPolling();
      } else {
        btn.textContent = "Resume Auto Refresh";
        stopPolling();
      }
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(() => fetchPotholes(false), DETECTION_INTERVAL_MS);
    }

    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
    }

    function startHistoryPolling() {
      stopHistoryPolling();
      historyTimer = setInterval(fetchHistory, HISTORY_INTERVAL_MS);
    }

    function stopHistoryPolling() {
      if (historyTimer) clearInterval(historyTimer);
      historyTimer = null;
    }

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 12.9716, lng: 77.5946 },
        zoom: 13,
        streetViewControl: false,
        mapTypeControl: false
      });

      document.getElementById("refreshBtn").addEventListener("click", () => fetchPotholes(false));
      document.getElementById("resetBtn").addEventListener("click", () => fetchPotholes(true));
      document.getElementById("autoBtn").addEventListener("click", toggleAutoRefresh);
      document.getElementById("filterSeverity").addEventListener("change", applyHistoryFilters);
      document.getElementById("filterSource").addEventListener("input", applyHistoryFilters);
      document.getElementById("filterFrom").addEventListener("change", applyHistoryFilters);
      document.getElementById("filterTo").addEventListener("change", applyHistoryFilters);
      document.getElementById("filterLimit").addEventListener("change", fetchHistory);
      document.getElementById("sourceInput").addEventListener("change", () => fetchPotholes(true));

      fetchPotholes();
      startPolling();
      startHistoryPolling();
    }
  </script>

  <!-- Replace YOUR_GOOGLE_MAPS_API_KEY with your real key -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDAjPqYrnsr4Xmedb3qtdIjacjsXmYCZjM&callback=initMap"></script>
</body>
</html>
